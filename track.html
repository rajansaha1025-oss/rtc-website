<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Your File | RTC Narsingdi</title><meta name="description" content="Check the status of your visa, passport or document file with Rajan Travel and Computers (RTC) using your tracking code.">
<link rel="canonical" href="https://rajansaha1025-oss.github.io/rtc-website/track.html"><link rel="icon" href="favicon.png"><meta name="theme-color" content="#27386b">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.tk{max-width:560px;margin:28px auto}.tk form{display:flex;gap:10px;flex-wrap:wrap}.tk input{flex:1;min-width:180px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 17px inherit;font-family:inherit;text-transform:uppercase;letter-spacing:1px}
.tk .res{margin-top:22px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:20px}
.stp{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}.stp li{display:flex;gap:12px;align-items:center;color:var(--mut)}
.stp i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font:700 13px Poppins,sans-serif;font-style:normal;flex-shrink:0}
.stp li.done{color:var(--ink)}.stp li.done i{background:#16794f;border-color:#16794f;color:#fff}.stp li.now{color:var(--ink);font-weight:700}.stp li.now i{border-color:var(--ora);color:var(--ora)}
.err{color:#c8281a;margin-top:14px}
</style></head>
<body class="pgx"><header><div class="w nv"><a href="./" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex:1"><img src="logo.webp" width="40" height="40" alt="RTC logo"><b>Rajan Travel (RTC)</b></a><a class="bt s" data-wa="Track my file" target="_blank" rel="noopener">WhatsApp</a></div></header>
<div class="hero"><div class="w"><h1>Track your file</h1><p><b>আপনার ফাইলের অবস্থা দেখুন</b></p><p>Enter the tracking code we gave you (example: RTC-4K7M2P).</p><p class="bn">আমাদের দেওয়া ট্র্যাকিং কোড লিখুন।</p></div></div>
<section><div class="w"><div class="tk">
<form id="f"><input id="c" placeholder="RTC-XXXXXX" autocomplete="off" required maxlength="20" aria-label="Tracking code"><button class="bt" type="submit">Check / দেখুন</button></form>
<div id="r" aria-live="polite"></div>
<p class="bn" style="margin-top:20px;font-size:14px">Code not working? WhatsApp or call us and we will check for you. / কোড কাজ না করলে হোয়াটসঅ্যাপ বা ফোন করুন।</p>
</div></div></section>
<script type="module">
import {DEF,load,esc,PID} from "./shared.js";
const STEPS=[["received","Documents received","কাগজ পেয়েছি"],["processing","Processing","প্রসেস চলছে"],["submitted","Submitted / applied","জমা দেওয়া হয়েছে"],["ready","Ready for you","আপনার জন্য প্রস্তুত"],["delivered","Delivered","হস্তান্তর সম্পন্ন"]];
const run=r=>{const v=k=>r.find(x=>x.id==="setting_"+k)?.details||DEF[k],n=v("whatsapp").replace(/\D/g,"");
document.querySelectorAll("[data-wa]").forEach(a=>a.href="https://wa.me/"+n+"?text="+encodeURIComponent("Assalamu alaikum, I need help with: "+a.dataset.wa))};run([]);load().then(run);
const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search).get("c"); if(q){$("#c").value=q;go(q)}
$("#f").onsubmit=e=>{e.preventDefault();go($("#c").value)};
async function go(raw){
  const code=String(raw).trim().toUpperCase().replace(/[^A-Z0-9-]/g,""),out=$("#r");
  if(code.length<4){out.innerHTML='<p class="err">Please enter a valid code. / সঠিক কোড দিন।</p>';return}
  out.innerHTML='<p>Checking… / খোঁজা হচ্ছে…</p>';
  try{
    const res=await fetch(`https://firestore.googleapis.com/v1/projects/${PID}/databases/(default)/documents/track/${encodeURIComponent(code)}`);
    if(res.status===404||res.status===403){out.innerHTML='<p class="err">No file found for this code. Check it and try again. / এই কোডে কোনো ফাইল পাওয়া যায়নি।</p>';return}
    if(!res.ok)throw 0;
    const f=(await res.json()).fields||{},g=k=>f[k]?.stringValue||"";
    const cur=Math.max(0,STEPS.findIndex(s=>s[0]===g("status")));
    const when=f.updatedAt?.timestampValue?new Date(f.updatedAt.timestampValue).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
    out.innerHTML=`<div class="res"><b style="font-size:18px">${esc(g("name"))||"Your file"}</b><div style="color:var(--mut)">${esc(g("service"))}${when?" · Updated "+when:""}</div>
    <ul class="stp">${STEPS.map((s,i)=>`<li class="${i<cur?"done":i===cur?"now":""}"><i>${i<cur?"✓":i+1}</i><span>${s[1]} / ${s[2]}</span></li>`).join("")}</ul>
    ${g("note")?`<p style="margin-top:16px;padding:12px;border-radius:10px;background:var(--bg)">${esc(g("note"))}</p>`:""}</div>`;
  }catch(e){out.innerHTML='<p class="err">Could not check right now. Please WhatsApp us. / এখন চেক করা যাচ্ছে না, হোয়াটসঅ্যাপ করুন।</p>'}
}
</script><script src="track.js"></script>
</body></html>
