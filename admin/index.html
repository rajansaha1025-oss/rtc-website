<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTC Admin</title><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#27386b">
<style>
:root{--bg:#f1f5fb;--cd:#fff;--ink:#14213d;--mut:#5a6a85;--ln:#dfe7f3;--nv:#27386b;--ora:#f05a28}
@media(prefers-color-scheme:dark){:root{--bg:#0a1226;--cd:#131d38;--ink:#eaf0fb;--mut:#9db0cf;--ln:#223056}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,'Hind Siliguri',sans-serif;padding-bottom:80px}
header{background:var(--nv);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}header b{flex:1}
main{max-width:640px;margin:0 auto;padding:14px}h2{margin:4px 0 8px}h4{margin:18px 0 8px;color:var(--ora)}.s{color:var(--mut);font-size:13px;margin:0 0 12px}
.r{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r>div{flex:1;min-width:140px}.r small{display:block;color:var(--mut)}.r p{margin:2px 0;width:100%;font-size:13px;color:var(--mut)}.r.d{opacity:.55}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:9px;padding:6px 12px}
.b{background:linear-gradient(120deg,var(--ora),#ec1c24);color:#fff;border:0;width:100%;padding:12px;font-weight:700;margin:8px 0;border-radius:10px}
a.i{border:1px solid var(--ln);border-radius:9px;padding:6px 12px;text-decoration:none;color:var(--ink);background:var(--cd)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}input,select,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}.sw{position:relative;width:46px;height:26px;margin:0;display:inline-block}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:#b8c2d6;transition:.2s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:#16a34a}.sw input:checked+i:after{left:23px}
#lg{max-width:360px;margin:12vh auto;padding:20px;background:var(--cd);border-radius:16px;text-align:center}#lg img{width:90px}#er{color:#d33;min-height:20px}
#nv{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
#nv button{flex:1 0 74px;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:20px;padding:8px 4px}#nv small{font-size:11px}#nv .on{color:var(--ora);font-weight:700}
#c{background:#ec1c24;color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
dialog{border:0;border-radius:16px;width:min(480px,94vw);padding:18px;background:var(--cd);color:var(--ink);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.55)}
.pv{max-width:100%;max-height:120px;border-radius:8px;margin-top:6px}[hidden]{display:none!important}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;border-radius:99px;padding:8px 16px;opacity:0;transition:.2s;pointer-events:none}#ts.on{opacity:1}
</style></head><body>
<div id="lg"><img src="icon-192.png" alt="RTC"><h2>RTC Admin</h2>
<form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
<p id="er"></p><button class="b">Sign in</button></form></div>
<div id="app" hidden><header><b>RTC Admin</b><a class="i" href="../" target="_blank">View site</a><button id="out">Logout</button></header><main id="m"></main><nav id="nv"></nav></div>
<dialog id="dg"></dialog><div id="ts"></div>
<script type="module">
import {firebaseConfig as FC,COLLECTION as COL} from "./firebase-config.js";
import {CAT,REQ,esc,lines} from "../shared.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,onSnapshot,doc,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=s=>document.querySelector(s),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x";
const app=initializeApp(FC),auth=getAuth(app),db=getFirestore(app);
let R=[],Q=[],TK=[],tab="inbox",un=[];
const of=t=>R.filter(r=>r.type===t),val=id=>R.find(r=>r.id===id);
const toast=m=>{const t=$("#ts");t.textContent=m;t.className="on";setTimeout(()=>t.className="",2400)};
const bump=()=>setDoc(doc(db,COL,"_v"),{type:"ver",title:String(Date.now())});
const save=async(id,d)=>{await setDoc(doc(db,COL,id),d,{merge:true});await bump()};
const del=async id=>{await deleteDoc(doc(db,COL,id));await bump()};
const run=p=>p.then(()=>toast("Saved ✓")).catch(e=>toast("Not allowed: "+e.code));
const all=()=>[...CAT.flatMap(c=>c[3].split(";").map(x=>x.split(":"))),...of("service").map(s=>[s.title,""])];
const T={
 package:[["title","Name"],["title_bn","Name (Bangla)"],["details","Details","a"],["details_bn","Details (Bangla)","a"],["price","Price (e.g. From ৳8,500)"],["img","Photo","i",900,600]],
 member:[["title","Name"],["details","Role"],["details_bn","Role (Bangla)"],["img","Photo (face in the middle)","i",400,400]],
 gallery:[["title","Caption"],["img","Photo","i",900,600]],
 review:[["title","Customer name"],["details","Review","a"],["details_bn","Review (Bangla, optional)","a"],["price","Stars (1 to 5)","n"]],
 notice:[["title","Headline"],["details","More text (optional)"]],
 req:[["title","Service","s"],["details","Documents needed (one per line)","l"]],
 service:[["title","Service name"],["title_bn","Name (Bangla)"],["price","Category","c"]]};
const TABS=[["inbox","📥","Inbox"],["track","🔎","Track"],["svc","🧩","Services"],["req","📄","Documents"],["package","🏝️","Packages"],["member","👥","Team"],["gallery","🖼️","Gallery"],["review","⭐","Reviews"],["notice","📢","Notice"],["set","⚙️","Settings"]];
const KEYS=[["phone","Phone"],["whatsapp","WhatsApp (digits only, e.g. 8801711773086)"],["email","Email"],["facebook","Facebook page link"],["address","Address"],["map","Google Maps link"],["bkash","bKash number (e.g. 01XXXXXXXXX Personal)"],["nagad","Nagad number (e.g. 01XXXXXXXXX Personal)"],["review","Google review link (customers tap to review you)"],["trade_no","Trade licence number / validity"],["travel_no","Travel agency licence number / validity"]];
/* resize a chosen photo in the browser and keep it small enough to store as text */
const shrink=(f,w,h)=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),r=w/h;let sw=im.width,sh=im.height,sx=0,sy=0;
 if(sw/sh>r){const n=sh*r;sx=(sw-n)/2;sw=n}else{const n=sw/r;sy=(sh-n)/2;sh=n}c.width=w;c.height=h;c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,w,h);
 let u=c.toDataURL("image/webp",.8);if(!u.startsWith("data:image/webp"))u=c.toDataURL("image/jpeg",.8);ok(u)};im.onerror=no;im.src=URL.createObjectURL(f)});
$("#lf").onsubmit=async e=>{e.preventDefault();$("#er").textContent="";try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value)}catch(x){$("#er").textContent="Wrong email or password."}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("#lg").hidden=!!u;$("#app").hidden=!u;un.forEach(f=>f());un=[];
 if(u)un=[onSnapshot(collection(db,COL),s=>{R=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast("Cannot read: "+e.code)),
  onSnapshot(collection(db,"track"),s=>{TK=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast("Cannot read track: "+e.code)),
  onSnapshot(collection(db,"inquiries"),s=>{Q=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.status==="done")-(b.status==="done")||(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render()},e=>toast("Cannot read inbox: "+e.code))]});
$("#nv").innerHTML=TABS.map(([k,i,l])=>`<button data-t="${k}">${i}${k==="inbox"?'<span id="c"></span>':""}<small>${l}</small></button>`).join("");
$("#nv").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render(true);scrollTo(0,0)}};
function render(force){const m=$("#m"),n=Q.filter(x=>x.status!=="done").length;$("#c").textContent=n||"";$("#c").hidden=!n;
 document.querySelectorAll("#nv button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const a=document.activeElement;if(!force&&a&&m.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="checkbox")return;
 ({inbox,svc,set,track:trk}[tab]||(x=>list(x,tab,`<h2>${TABS.find(t=>t[0]===tab)[2]}</h2>`)))(m)}
function inbox(m){const num=p=>{const n=String(p||"").replace(/\D/g,"");return n.startsWith("880")?n:n.startsWith("0")?"88"+n:"880"+n};
 const when=x=>x.createdAt?.seconds?new Date(x.createdAt.seconds*1e3).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
 const ms=x=>(x.createdAt?.seconds||0)*1e3,d0=new Date().setHours(0,0,0,0),top=k=>Object.entries(Q.reduce((a,x)=>(a[x[k]||"-"]=(a[x[k]||"-"]||0)+1,a),{})).sort((a,b)=>b[1]-a[1])[0]||["-"];
 m.innerHTML=`<h2>Inbox</h2><div class="r"><div><b>${Q.filter(x=>ms(x)>=d0).length}</b><small>Today</small></div><div><b>${Q.filter(x=>ms(x)>=Date.now()-6048e5).length}</b><small>Last 7 days</small></div><div><b>${esc(top("service")[0])}</b><small>Top service</small></div><div><b>${esc(top("source")[0])}</b><small>Top source</small></div></div><button id="csv" style="margin-bottom:10px">⬇ Export CSV (Excel)</button><p class="s">Reply on WhatsApp or call, then mark done.</p>`+(Q.map(x=>`<div class="r ${x.status==="done"?"d":""}"><div><b>${x.status==="done"?"":"🔴 "}${esc(x.name)} · ${esc(x.service)}</b><small>${esc(x.phone)} · ${esc(x.location)} · ${when(x)}${x.source?" · via "+esc(x.source):""}</small></div>${x.note?`<p>“${esc(x.note)}”</p>`:""}
 <a class="i" target="_blank" href="https://wa.me/${num(x.phone)}?text=${encodeURIComponent("Assalamu alaikum "+x.name+", this is Rajan Travel (RTC). About your enquiry for "+x.service+": ")}">💬 WhatsApp</a><a class="i" href="tel:${esc(x.phone)}">📞 Call</a>
 <button data-s="${x.id}" data-v="${x.status==="done"?"new":"done"}">${x.status==="done"?"Reopen":"✓ Done"}</button><button data-d="${x.id}">🗑</button></div>`).join("")||'<p class="s">No enquiries yet.</p>');
 $("#csv").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',rows=[["Date","Name","Phone","Service","Area","Note","Source","Status"],...Q.map(x=>[ms(x)?new Date(ms(x)).toISOString():"",x.name,x.phone,x.service,x.location,x.note,x.source,x.status])],a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="rtc-enquiries.csv";a.click()};
 m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>setDoc(doc(db,"inquiries",b.dataset.s),{status:b.dataset.v},{merge:true}).catch(e=>toast("Not allowed: "+e.code)));
 m.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>confirm("Delete this enquiry?")&&deleteDoc(doc(db,"inquiries",b.dataset.d)).catch(e=>toast("Not allowed: "+e.code)))}
function list(m,type,pre=""){const rows=of(type).sort((a,b)=>a.id<b.id?1:-1);
 m.innerHTML=pre+`<button class="b" id="add">+ Add</button>`+(rows.map(r=>`<div class="r"><div><b>${esc(r.title)}</b><small>${esc(type==="req"?lines(r.details).length+" documents":r.price||r.details||"")}</small></div><button data-e="${r.id}">Edit</button><button data-x="${r.id}">🗑</button></div>`).join("")||'<p class="s">Nothing here yet.</p>');
 m.querySelector("#add").onclick=()=>form(type);m.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>form(type,val(b.dataset.e)));
 m.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>confirm("Delete this?")&&run(del(b.dataset.x)))}
function form(type,d){const g=$("#dg");
 g.innerHTML=`<h3>${d?"Edit":"Add"}</h3>`+T[type].map(([k,l,kind,w,h])=>{const v=d?d[k]??"":"";
  if(kind==="s")return `<label>${l}<select name="${k}" ${d?"disabled":""}>${all().map(s=>`<option ${s[0]===v?"selected":""}>${esc(s[0])}</option>`).join("")}</select></label>`;
  if(kind==="c")return `<label>${l}<select name="${k}">${CAT.map(x=>`<option ${x[1]===v?"selected":""}>${x[1]}</option>`).join("")}</select></label>`;
  if(kind==="a")return `<label>${l}<textarea name="${k}" rows="3">${esc(v)}</textarea></label>`;
  if(kind==="l")return `<label>${l}<textarea name="${k}" rows="8">${esc(lines(v).join("\n"))}</textarea></label>`;
  if(kind==="n")return `<label>${l}<input name="${k}" type="number" min="1" max="5" value="${esc(v||5)}"></label>`;
  if(kind==="i")return `<label>${l}<input type="file" accept="image/*" data-w="${w}" data-h="${h}"></label><img class="pv" src="${esc(v)}" ${v?"":"hidden"}><input type="hidden" name="${k}" value="${esc(v)}">`;
  return `<label>${l}<input name="${k}" value="${esc(v)}"></label>`}).join("")+`<button class="b" id="sv">Save</button><button id="cx" style="width:100%">Cancel</button>`;
 if(type==="req"&&!d){const s=g.querySelector("select"),t=g.querySelector("textarea"),f=()=>{t.value=(REQ[(all().find(x=>x[0]===s.value)||[])[1]]||[]).join("\n")};s.onchange=f;f()}
 g.querySelectorAll("input[type=file]").forEach(f=>f.onchange=async()=>{try{const u=await shrink(f.files[0],+f.dataset.w,+f.dataset.h);if(u.length>700000)return toast("Photo too big, try another");
  const p=f.parentElement.nextElementSibling;p.src=u;p.hidden=false;p.nextElementSibling.value=u}catch(e){toast("Cannot read that photo")}});
 $("#cx").onclick=()=>g.close();
 $("#sv").onclick=()=>{const o={type};g.querySelectorAll("[name]").forEach(e=>o[e.name]=e.value.trim());
  if(type==="req")o.details=o.details.split("\n").map(x=>x.trim()).filter(Boolean).join("|");
  if(!o.title)return toast("Title is needed");
  const id=d?d.id:type==="req"?"req_"+slug(o.title):type+"_"+Date.now();g.close();run(save(id,o))};
 g.showModal()}
function trk(m){const S=["received","processing","submitted","ready","delivered"],base=location.origin+location.pathname.replace(/admin\/.*$/,"");
 m.innerHTML=`<h2>Track files</h2><p class="s">Create a code for each customer file. They check progress on the website. Use first name only if you want privacy.</p><button class="b" id="ta">+ New file</button>`+
 (TK.sort((a,b)=>(b.at||0)-(a.at||0)).map(x=>`<div class="r"><div><b>${esc(x.id)} · ${esc(x.name)}</b><small>${esc(x.service)}${x.note?" · "+esc(x.note):""}</small></div><select data-c="${x.id}">${S.map(v=>`<option ${v===x.status?"selected":""}>${v}</option>`).join("")}</select><button data-n="${x.id}">✏️</button><a class="i" target="_blank" href="https://wa.me/?text=${encodeURIComponent("Track your file: "+base+"?t="+x.id)}">📤</a><button data-x="${x.id}">🗑</button></div>`).join("")||'<p class="s">No files yet.</p>');
 m.querySelectorAll("select").forEach(s=>s.onchange=()=>run(setDoc(doc(db,"track",s.dataset.c),{status:s.value,at:Date.now()},{merge:true})));
 m.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const t=prompt("Note for the customer",TK.find(x=>x.id===b.dataset.n)?.note||"");if(t!==null)run(setDoc(doc(db,"track",b.dataset.n),{note:t.trim()},{merge:true}))});
 m.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>confirm("Delete this file?")&&run(deleteDoc(doc(db,"track",b.dataset.x))));
 $("#ta").onclick=()=>{const g=$("#dg");g.innerHTML=`<h3>New file</h3><label>Customer name<input id="tn"></label><label>Service<select id="tsv">${all().map(s=>`<option>${esc(s[0])}</option>`).join("")}</select></label><label>Note (optional)<input id="to"></label><button class="b" id="tv">Create code</button><button id="cx" style="width:100%">Cancel</button>`;
  $("#cx").onclick=()=>g.close();$("#tv").onclick=()=>{const n=$("#tn").value.trim();if(!n)return toast("Name needed");const c="RTC-"+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[b%31]).join("");
   g.close();run(setDoc(doc(db,"track",c),{name:n,service:$("#tsv").value,note:$("#to").value.trim(),status:"received",at:Date.now()}));toast("Code: "+c)};g.showModal()}}
function svc(m){const hid=new Set(of("hide").map(r=>r.title));
 m.innerHTML=`<h2>Services</h2><p class="s">Switch off to hide a service from the website. Add your own at the bottom.</p>`+CAT.map(c=>`<h4>${c[0]} ${c[1]}</h4>`+c[3].split(";").map(x=>x.split(":")[0]).map(n=>`<div class="r"><div><b>${esc(n)}</b></div><label class="sw"><input type="checkbox" data-n="${esc(n)}" ${hid.has(n)?"":"checked"}><i></i></label></div>`).join("")).join("")+`<h4>Your own services</h4><div id="cs"></div>`;
 m.querySelectorAll(".sw input").forEach(c=>c.onchange=()=>run(c.checked?del("hide_"+slug(c.dataset.n)):save("hide_"+slug(c.dataset.n),{type:"hide",title:c.dataset.n})));
 list($("#cs"),"service")}
function set(m){const s=val("status")||{};
 m.innerHTML=`<h2>Settings</h2><p class="s">Leave a box empty to use the built-in value.</p>`+KEYS.map(([k,l])=>`<label>${l}<input data-k="${k}" value="${esc(val("setting_"+k)?.details)}"></label>`).join("")+
 `<h4>Office status badge</h4><label>Mode<select id="sm">${[["auto","Auto: every day 10 AM to 9 PM"],["open","Open now"],["closed","Closed (holiday)"],["off","Hide the badge"]].map(([v,l])=>`<option value="${v}" ${(s.title||"auto")===v?"selected":""}>${l}</option>`).join("")}</select></label>
 <label>Message (optional)<input id="se" value="${esc(s.details)}"></label><label>Message (Bangla)<input id="sb" value="${esc(s.details_bn)}"></label><button class="b" id="ss">Save</button>`;
 $("#ss").onclick=()=>run(Promise.all([...m.querySelectorAll("[data-k]")].map(i=>{const k=i.dataset.k,v=i.value.trim();return v?save("setting_"+k,{type:"setting",title:k,details:v}):val("setting_"+k)?del("setting_"+k):0}).concat(save("status",{type:"status",title:$("#sm").value,details:$("#se").value.trim(),details_bn:$("#sb").value.trim()}))))}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
