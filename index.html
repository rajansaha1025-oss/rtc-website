<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajan Travel and Computers (RTC) | Visa, Tickets, Documents, Tours - Narsingdi</title>
<meta name="description" content="Visa, passport, air tickets, NID/TIN/Police Clearance, admission and tour packages. Office in Narsingdi, service available online across Bangladesh.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--ink:#07122b;--navy:#0d2150;--blue:#1c4c96;--red:#e33524;--gold:#e8c26a;--mist:#9fb0d0;--txt:#e8edf8;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Poppins','Hind Siliguri',sans-serif;background:var(--ink);color:var(--txt);line-height:1.65;overflow-x:hidden}
h1,h2,h3{font-family:'Fraunces','Hind Siliguri',serif;line-height:1.15}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1200px;margin:auto;padding:0 5%}
section{padding:96px 0}
h2{font-size:clamp(30px,4.5vw,46px);font-weight:800;margin-bottom:12px}
.lead{color:var(--mist);max-width:620px;margin-bottom:44px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;border-radius:50px;font-weight:600;border:0;cursor:pointer;font-size:15px;font-family:inherit;transition:.3s}
.btn.red{background:linear-gradient(45deg,var(--red),#ff6b4a);color:#fff;box-shadow:0 10px 24px rgba(227,53,36,.35)}
.btn.red:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(227,53,36,.45)}
.btn.ghost{border:1px solid var(--line);color:var(--txt);background:var(--glass)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}

/* notice + nav */
#notice{display:none;background:var(--gold);color:#241a00;text-align:center;font-size:14px;font-weight:500;padding:8px 5%;position:relative;z-index:1001}
header{position:sticky;top:0;z-index:1000;background:rgba(7,18,43,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 5%;max-width:1200px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:800;font-size:24px}
.logo img{height:46px;background:#fff;border-radius:8px;padding:3px}
.links{display:flex;gap:26px;list-style:none;font-size:14px}
.links a{opacity:.8;transition:.3s}.links a:hover{opacity:1;color:var(--gold)}
.nav-r{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:30px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mist);padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit}
